; Per-project PHP-FPM pool — generated by sre-helpers (scripts/common/isolation.sh)
; Keep in sync with servers-manage agent/internal/fpmpool/templates/pool.conf
[{POOL_NAME}]
user = {POOL_USER}
group = {POOL_USER}

listen = {SOCKET}
listen.owner = {WEB_USER}
listen.group = {WEB_USER}
listen.mode = 0660

pm = ondemand
pm.max_children = {MAX_CHILDREN}
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Confinement: PHP may only open files inside the project (+ declared extras)
php_admin_value[open_basedir] = {OPEN_BASEDIR}
php_admin_value[sys_temp_dir] = {PROJECT_DIR}/.php-tmp
php_admin_value[upload_tmp_dir] = {PROJECT_DIR}/.php-tmp
php_admin_value[session.save_path] = {PROJECT_DIR}/.php-sessions
php_admin_value[disable_functions] = passthru,shell_exec,system,popen,pcntl_exec,dl
php_admin_value[error_log] = /var/log/php-fpm/{POOL_NAME}-error.log
php_admin_flag[log_errors] = on

slowlog = /var/log/php-fpm/{POOL_NAME}-slow.log
request_slowlog_timeout = 10s
